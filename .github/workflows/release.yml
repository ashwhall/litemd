name: Release

# Push a version tag to publish: git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: make test
      - run: make zip VERSION="${GITHUB_REF_NAME#v}" BUILD="$GITHUB_RUN_NUMBER"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/LiteMD.zip --title "LiteMD ${GITHUB_REF_NAME#v}" --generate-notes
